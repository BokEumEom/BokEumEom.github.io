about_content: | # this will include new lines to allow paragraphs
  AWS-focused DevOps, Platform, and Infrastructure Engineer with 15+ years of experience across on-premises infrastructure, virtualization, and AWS cloud environments.

  Experienced in building and operating production AWS platforms using Terraform, ECS Fargate, GitLab CI/CD, centralized logging, monitoring, and security automation. Strong background in infrastructure standardization, deployment automation, observability, cloud security operations, cost visibility, and production service troubleshooting.

  Currently working on AWS-based infrastructure and DevOps operations for an energy platform startup, supporting production environments, deployment automation, observability, security operations, and operational reporting. Recently exploring AI-assisted workflows for infrastructure analysis, operational documentation, reporting automation, and service operations.

  I am most skilled in: <mark>AWS</mark>, <mark>Terraform</mark>, <mark>ECS Fargate</mark> and <mark>AI-Assisted Workflows</mark>


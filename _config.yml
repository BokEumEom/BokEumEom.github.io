  Senior DevOps Engineer with 15+ years of infrastructure experience across on-premises, virtualization, and AWS cloud environments.
  Specialized in building and operating production AWS platforms using Terraform, ECS Fargate, GitLab CI/CD, centralized logging, monitoring, and security automation.
  Focused on building repeatable, secure, and observable systems that improve reliability and delivery speed.

  I am most skilled in: <mark>AWS</mark> and <mark>Terraform</mark> and <mark>ECS Fargate</mark>

